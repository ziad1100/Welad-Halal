services:
  db:
    image: postgres:16-alpine
    container_name: kstore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kstore
      POSTGRES_PASSWORD: kstore
      POSTGRES_DB: kstore
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kstore -d kstore"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: kstore-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    container_name: kstore-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://kstore:kstore@db:5432/kstore?schema=public
      DIRECT_URL: postgresql://kstore:kstore@db:5432/kstore?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me-min-32-chars-please}
      JWT_EXPIRES_IN: 8h
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      PORT: 3001
    ports:
      - "3001:3001"
    command: sh -c "npx prisma migrate deploy && node dist/src/main.js"

volumes:
  pgdata:
  redisdata:
