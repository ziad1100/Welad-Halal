services:
  - type: web
    name: kstore-backend
    runtime: node
    rootDir: apps/backend
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: node dist/src/main.js
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: CORS_ORIGIN
        sync: false
      - key: REDIS_URL
        sync: false
      # PORT intentionally NOT pinned: Render injects its own PORT at runtime
      # and the app listens on process.env.PORT (default 3001 locally).
      - key: NODE_ENV
        value: production
      - key: GIT_SHA
        sync: false

# NOTE (why no database stanza here): production PostgreSQL is hosted on Neon,
# not Render — DATABASE_URL (pooled) + DIRECT_URL (direct) point at Neon.
# The Render Postgres stanza was deliberately removed so no redundant database
# can be accidentally provisioned. See DEPLOY.md Phase 1.
