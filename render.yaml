services:
  - type: web
    name: kstore-backend
    runtime: node
    rootDir: apps/backend
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: node dist/src/main.js
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: CORS_ORIGIN
        sync: false
      - key: REDIS_URL
        sync: false
      - key: PORT
        value: 3001

databases:
  - name: kstore-postgres
    plan: starter
